# /etc/nginx/sites-available/clearing-logistics-erp
events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # Location for the frontend application
        location / {
            # The root should point to your frontend's build output directory (e.g., dist)
            root /home/faruq/clearing-logistics-erp/frontend/dist; 
            try_files $uri $uri/ /index.html;
        }

        # Location for the backend API
        location /api/ {
            # Forward requests to the backend API server
            proxy_pass http://127.0.0.1:8000;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
